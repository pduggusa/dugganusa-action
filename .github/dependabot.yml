version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Never propose a release younger than 14 days (supply-chain cooldown; matches our pinning rule).
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Never propose a release younger than 14 days (supply-chain cooldown; matches our pinning rule).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # patterns.js calls the 1.x CommonJS API (require('brace-expansion')(str)); 2.x+ changed the
      # export and 5.x is ESM. Majors need a code change, not a bump. The override follows the
      # direct dependency ("$brace-expansion"), so minimatch gets the same patched 1.x.
      - dependency-name: brace-expansion
        update-types: ["version-update:semver-major"]
      # index.js is CommonJS; @actions/core 2.x+ and @actions/glob majors are ESM-only. Majors need a code change.
      - dependency-name: "@actions/*"
        update-types: ["version-update:semver-major"]
      # @actions/glob is 0.x: a minor bump can be breaking (0.7.0 is ESM-only). Hold minors too.
      - dependency-name: "@actions/glob"
        update-types: ["version-update:semver-minor"]
