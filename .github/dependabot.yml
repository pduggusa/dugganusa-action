version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # patterns.js calls the 1.x CommonJS API (require('brace-expansion')(str)); 2.x+ changed the
      # export and 5.x is ESM. Majors need a code change, not a bump. The override follows the
      # direct dependency ("$brace-expansion"), so minimatch gets the same patched 1.x.
      - dependency-name: brace-expansion
        update-types: ["version-update:semver-major"]
